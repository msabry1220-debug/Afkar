<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دفتر أفكاري</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#f4f1ea;color:#222;padding:16px;max-width:720px;margin-inline:auto}
h1{font-size:22px;margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:#2d5a47;color:#fff;cursor:pointer}
button.sec{background:#e4ded0;color:#222}
button.rec{background:#c0392b}
#mic{flex:1;font-size:18px;padding:16px}
textarea{width:100%;min-height:220px;font:inherit;font-size:17px;line-height:1.8;padding:12px;border:1px solid #cfc8b6;border-radius:12px;background:#fff;resize:vertical}
#interim{color:#888;min-height:24px;font-size:15px}
#status{font-size:14px;color:#555}
.idea{background:#fff;border-radius:12px;padding:12px;margin:10px 0;border:1px solid #e0d9c7}
.idea small{color:#888;display:block;margin-bottom:6px}
.idea p{margin:0 0 8px;white-space:pre-wrap;line-height:1.7}
.idea button{padding:6px 12px;font-size:14px}
</style>
</head>
<body>
<h1>🎙️ دفتر أفكاري</h1>
<div class="row">
  <button id="mic">ابدأ التسجيل</button>
</div>
<div id="status">جاهز</div>
<textarea id="text" placeholder="الكلام هيتكتب هنا... تقدر تعدّل عليه بإيدك"></textarea>
<div id="interim"></div>
<div class="row">
  <button id="save">💾 احفظ الفكرة</button>
  <button id="copy" class="sec">نسخ</button>
  <button id="share" class="sec">مشاركة</button>
  <button id="dl" class="sec">تنزيل txt</button>
  <button id="clear" class="sec">مسح</button>
</div>
<h2 style="font-size:18px">الأفكار المحفوظة</h2>
<div id="list"></div>

<script>
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,running=false;
const text=$('text');

function setStatus(s){$('status').textContent=s}

if(!SR){setStatus('المتصفح ده مش بيدعم التعرف على الصوت. افتحها من Chrome.');$('mic').disabled=true}

function build(){
  rec=new SR();
  rec.lang='ar-EG';
  rec.continuous=false;      // أثبت على أندرويد، وبنعيد التشغيل تلقائي
  rec.interimResults=true;
  rec.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal){
        const t=r[0].transcript.trim();
        if(t){text.value+=(text.value&&!/\s$/.test(text.value)?' ':'')+t}
      }else interim+=r[0].transcript;
    }
    $('interim').textContent=interim;
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      running=false;setStatus('الميكروفون مش مسموح. اسمح له من إعدادات الموقع في Chrome.');ui();
    }
  };
  rec.onend=()=>{
    $('interim').textContent='';
    if(running){try{rec.start()}catch(_){setTimeout(()=>{try{rec.start()}catch(_){}},300)}}
    else ui();
  };
}
function ui(){
  $('mic').textContent=running?'⏹ إيقاف':'ابدأ التسجيل';
  $('mic').classList.toggle('rec',running);
  if(running)setStatus('بسمعك... اتكلم براحتك');
  else if(!/مش/.test($('status').textContent))setStatus('متوقف');
}
$('mic').onclick=()=>{
  if(!rec)build();
  if(running){running=false;rec.stop();ui();return}
  running=true;ui();
  try{rec.start()}catch(_){}
};

// الأفكار المحفوظة
function load(){try{return JSON.parse(localStorage.getItem('ideas')||'[]')}catch(_){return[]}}
function store(a){try{localStorage.setItem('ideas',JSON.stringify(a))}catch(_){}}
function render(){
  const a=load();const l=$('list');l.innerHTML='';
  if(!a.length){l.textContent='لسه مفيش أفكار محفوظة.';return}
  a.forEach((it,i)=>{
    const d=document.createElement('div');d.className='idea';
    const s=document.createElement('small');s.textContent=new Date(it.t).toLocaleString('ar-EG');
    const p=document.createElement('p');p.textContent=it.x;
    const e=document.createElement('button');e.className='sec';e.textContent='تعديل';
    e.onclick=()=>{text.value=it.x;scrollTo(0,0)};
    const c=document.createElement('button');c.className='sec';c.textContent='نسخ';
    c.onclick=()=>copyText(it.x);
    const x=document.createElement('button');x.className='sec';x.textContent='حذف';
    x.onclick=()=>{const b=load();b.splice(i,1);store(b);render()};
    d.append(s,p,e,' ',c,' ',x);l.append(d);
  });
}
$('save').onclick=()=>{
  const v=text.value.trim();if(!v)return;
  const a=load();a.unshift({t:Date.now(),x:v});store(a);text.value='';render();setStatus('اتحفظت ✅');
};
async function copyText(v){
  try{await navigator.clipboard.writeText(v);setStatus('اتنسخ ✅')}
  catch(_){text.select();document.execCommand('copy');setStatus('اتنسخ ✅')}
}
$('copy').onclick=()=>copyText(text.value);
$('share').onclick=async()=>{
  try{await navigator.share({text:text.value})}catch(_){copyText(text.value)}
};
$('dl').onclick=()=>{
  const b=new Blob([text.value],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='فكرة-'+new Date().toISOString().slice(0,10)+'.txt';a.click();
};
$('clear').onclick=()=>{text.value='';$('interim').textContent=''};
render();
</script>
</body>
</html>
